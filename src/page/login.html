<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Login E.Commerce</title>
    <link rel="stylesheet" href="../../public/css/login.css" />
    <meta name="api-base-url" content="" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>


    <div class="contenedor_login" id="loginContent">
      <div class="contenedor_inicio_sesion">
        <h2>Iniciar Sesión</h2>

        <form id="formulario_inicio" class="contenedor_formulario_inicio">
          <input type="email" id="correo" placeholder="Correo" required />
          <input
            type="password"
            id="contraseña"
            placeholder="Contraseña"
            required
          />
          <button class="boton_login" id="btnLogin" type="submit">
            Ingresar
          </button>
        </form>

        <p class="texto_registro">
          ¿No tienes cuenta?
          <a href="registro.html">Regístrate aquí</a>
        </p>
      </div>
    </div>

  
<script src="../logica/configuracion-api.js"></script>
<script src="../logica/login.js"></script>
  </body>
</html>
